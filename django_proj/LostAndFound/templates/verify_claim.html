<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Verification</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .verify-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 90%; text-align: center; border-top: 6px solid #38a169; }
        .icon { font-size: 50px; color: #38a169; margin-bottom: 10px; }
        h2 { color: #2d3748; margin: 0 0 20px 0; }
        .info-group { text-align: left; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .label { font-size: 12px; color: #718096; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .value { font-size: 18px; color: #1a202c; font-weight: bold; margin-top: 4px; }
        .footer { margin-top: 20px; font-size: 12px; color: #a0aec0; }
    </style>
</head>
<body>

<div class="verify-card">
    <div class="icon">✔️</div>
    <h2>Claim Verified</h2>
    
    <div class="info-group">
        <div class="label">Item Name</div>
        <div class="value">{{ item_name }} ({{ item_type|upper }})</div>
    </div>

    <div class="info-group">
        <div class="label">Username</div>
        <div class="value">{{ username }}</div>
    </div>

    <div class="info-group">
        <div class="label">ID Number</div>
        <div class="value">{{ id_number }}</div>
    </div>

    <div class="footer">
        Lost and Found Management System<br>
        Please hand over the item to this user.
    </div>
</div>

</body>
</html>
